<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Meeting Table -->
  <ellipse cx="200" cy="280" rx="140" ry="40" fill="#4A5568"/>
  <rect x="60" y="240" width="280" height="40" fill="#718096"/>
  
  <!-- Laptops on Table -->
  <rect x="90" y="220" width="60" height="40" rx="3" fill="#2D3748"/>
  <rect x="95" y="225" width="50" height="30" rx="2" fill="#1A202C"/>
  <rect x="100" y="228" width="40" height="20" fill="#4361EE" opacity="0.3"/>
  
  <rect x="250" y="220" width="60" height="40" rx="3" fill="#2D3748"/>
  <rect x="255" y="225" width="50" height="30" rx="2" fill="#1A202C"/>
  <rect x="260" y="228" width="40" height="20" fill="#48BB78" opacity="0.3"/>
  
  <!-- Person 1 (Mentor) -->
  <circle cx="120" cy="160" r="30" fill="#F7FAFC"/>
  <rect x="95" y="190" width="50" height="55" rx="10" fill="#4361EE"/>
  <rect x="80" y="200" width="15" height="10" rx="5" fill="#F7FAFC" transform="rotate(-20 87.5 205)"/>
  <rect x="145" y="200" width="15" height="10" rx="5" fill="#F7FAFC" transform="rotate(20 152.5 205)"/>
  
  <!-- Mentor Badge -->
  <circle cx="140" cy="155" r="12" fill="#48BB78"/>
  <text x="134" y="161" font-size="14" fill="#FFFFFF" font-weight="bold">M</text>
  
  <!-- Person 2 (Student) -->
  <circle cx="280" cy="160" r="30" fill="#F7FAFC"/>
  <rect x="255" y="190" width="50" height="55" rx="10" fill="#7F52FF"/>
  <rect x="240" y="200" width="15" height="10" rx="5" fill="#F7FAFC" transform="rotate(-20 247.5 205)"/>
  <rect x="305" y="200" width="15" height="10" rx="5" fill="#F7FAFC" transform="rotate(20 312.5 205)"/>
  
  <!-- Speech Bubbles -->
  <rect x="150" y="100" width="80" height="40" rx="8" fill="#FFFFFF" stroke="#4361EE" stroke-width="2"/>
  <polygon points="170,140 175,148 180,140" fill="#FFFFFF" stroke="#4361EE" stroke-width="2"/>
  <line x1="165" y1="115" x2="215" y2="115" stroke="#4361EE" stroke-width="2"/>
  <line x1="165" y1="125" x2="205" y2="125" stroke="#48BB78" stroke-width="2"/>
  
  <rect x="250" y="80" width="90" height="50" rx="8" fill="#FFFFFF" stroke="#7F52FF" stroke-width="2"/>
  <polygon points="280,130 285,138 290,130" fill="#FFFFFF" stroke="#7F52FF" stroke-width="2"/>
  <circle cx="270" cy="100" r="4" fill="#7F52FF"/>
  <circle cx="285" cy="100" r="4" fill="#7F52FF"/>
  <circle cx="300" cy="100" r="4" fill="#7F52FF"/>
  <text x="260" y="122" font-size="12" fill="#2D3748">Got it!</text>
  
  <!-- Whiteboard -->
  <rect x="30" y="40" width="120" height="80" rx="4" fill="#FFFFFF" stroke="#4A5568" stroke-width="2"/>
  
  <!-- Whiteboard Content -->
  <line x1="45" y1="55" x2="135" y2="55" stroke="#4361EE" stroke-width="2"/>
  <rect x="45" y="65" width="30" height="20" rx="2" fill="none" stroke="#48BB78" stroke-width="2"/>
  <circle cx="100" cy="75" r="10" fill="none" stroke="#F6AD55" stroke-width="2"/>
  <line x1="120" y1="65" x2="135" y2="80" stroke="#7F52FF" stroke-width="2"/>
  <line x1="120" y1="80" x2="135" y2="65" stroke="#7F52FF" stroke-width="2"/>
  <line x1="45" y1="95" x2="90" y2="95" stroke="#4361EE" stroke-width="1.5"/>
  <line x1="45" y1="105" x2="110" y2="105" stroke="#48BB78" stroke-width="1.5"/>
  
  <!-- Code Symbol Decorations -->
  <text x="330" y="60" font-family="monospace" font-size="28" fill="#4361EE" opacity="0.3">&lt;/&gt;</text>
  <text x="20" y="240" font-family="monospace" font-size="32" fill="#48BB78" opacity="0.3">{}</text>
  
  <!-- Books Stack -->
  <rect x="320" y="245" width="50" height="8" rx="2" fill="#FF2D20"/>
  <rect x="323" y="237" width="47" height="8" rx="2" fill="#7F52FF"/>
  <rect x="326" y="229" width="44" height="8" rx="2" fill="#48BB78"/>
</svg>
