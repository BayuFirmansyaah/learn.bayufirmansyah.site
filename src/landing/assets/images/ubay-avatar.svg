  <circle cx="85" cy="90" r="3" fill="#5B7FFF" opacity="0.3"/>
  <circle cx="25" cy="85" r="2" fill="#5B7FFF" opacity="0.3"/>
  
  <!-- Code Symbol Background -->
  <circle cx="60" cy="55" r="35" fill="#3651D4"/>
  
  <!-- Face -->
  <circle cx="60" cy="52" r="28" fill="#FFFFFF"/>
  
  <!-- Hair -->
  <path d="M32 45C32 35 38 28 48 26C52 25 56 25 60 25C64 25 68 25 72 26C82 28 88 35 88 45C88 48 87 51 85 54C83 52 80 51 77 51C75 44 68 39 60 39C52 39 45 44 43 51C40 51 37 52 35 54C33 51 32 48 32 45Z" fill="#2D3748"/>
  
