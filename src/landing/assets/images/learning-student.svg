<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Student at Desk -->
  <rect x="50" y="250" width="300" height="120" rx="8" fill="#4A5568"/>
  <rect x="60" y="240" width="280" height="10" rx="5" fill="#718096"/>
  
  <!-- Laptop -->
  <rect x="140" y="200" width="120" height="80" rx="4" fill="#2D3748"/>
  <rect x="145" y="205" width="110" height="65" rx="2" fill="#1A202C"/>
  
  <!-- Screen Glow -->
  <rect x="150" y="210" width="100" height="55" rx="2" fill="#4361EE" opacity="0.3"/>
  
  <!-- Code Lines on Screen -->
  <rect x="160" y="220" width="40" height="4" rx="2" fill="#48BB78"/>
  <rect x="160" y="230" width="60" height="4" rx="2" fill="#4361EE"/>
  <rect x="160" y="240" width="50" height="4" rx="2" fill="#F6AD55"/>
  <rect x="160" y="250" width="70" height="4" rx="2" fill="#7F52FF"/>
  
  <!-- Person -->
  <circle cx="200" cy="160" r="25" fill="#F7FAFC"/>
  <rect x="180" y="185" width="40" height="50" rx="8" fill="#4361EE"/>
  
  <!-- Arms -->
  <rect x="160" y="195" width="20" height="8" rx="4" fill="#F7FAFC" transform="rotate(-20 170 199)"/>
  <rect x="220" y="195" width="20" height="8" rx="4" fill="#F7FAFC" transform="rotate(20 230 199)"/>
  
  <!-- Books -->
  <rect x="80" y="230" width="40" height="8" rx="2" fill="#FF2D20"/>
  <rect x="85" y="222" width="35" height="8" rx="2" fill="#7F52FF"/>
  <rect x="90" y="214" width="30" height="8" rx="2" fill="#48BB78"/>
  
  <!-- Coffee Cup -->
  <rect x="280" y="225" width="30" height="25" rx="3" fill="#F7FAFC" stroke="#4A5568" stroke-width="2"/>
  <ellipse cx="295" cy="225" rx="15" ry="4" fill="#F7FAFC" stroke="#4A5568" stroke-width="2"/>
  
  <!-- Graduation Cap Icon -->
  <rect x="180" y="85" width="40" height="5" rx="2" fill="#48BB78"/>
  <path d="M 160 90 L 200 80 L 240 90 L 200 100 Z" fill="#4361EE"/>
  <rect x="235" y="90" width="3" height="25" fill="#4361EE"/>
  <circle cx="236.5" cy="118" r="4" fill="#F6AD55"/>
  
  <!-- Floating Icons -->
  <circle cx="320" cy="120" r="20" fill="#F0F4FF" stroke="#4361EE" stroke-width="2"/>
  <text x="310" y="130" font-size="20" fill="#4361EE">✓</text>
  
  <circle cx="80" cy="140" r="20" fill="#F0FFF4" stroke="#48BB78" stroke-width="2"/>
  <text x="70" y="150" font-size="20" fill="#48BB78">📚</text>
</svg>
