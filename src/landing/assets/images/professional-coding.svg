<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Desk Setup -->
  <rect x="50" y="280" width="300" height="100" rx="8" fill="#4A5568"/>
  <rect x="60" y="270" width="280" height="10" rx="5" fill="#718096"/>
  
  <!-- Monitor -->
  <rect x="120" y="140" width="160" height="120" rx="6" fill="#2D3748"/>
  <rect x="128" y="148" width="144" height="100" rx="4" fill="#1A202C"/>
  
  <!-- Code on Monitor -->
  <rect x="140" y="160" width="50" height="6" rx="3" fill="#4361EE"/>
  <rect x="140" y="175" width="80" height="6" rx="3" fill="#48BB78"/>
  <rect x="150" y="190" width="60" height="6" rx="3" fill="#F6AD55"/>
  <rect x="140" y="205" width="90" height="6" rx="3" fill="#7F52FF"/>
  <rect x="150" y="220" width="70" height="6" rx="3" fill="#4361EE"/>
  
  <!-- Monitor Stand -->
  <rect x="185" y="260" width="30" height="20" rx="4" fill="#4A5568"/>
  <rect x="170" y="280" width="60" height="8" rx="4" fill="#718096"/>
  
  <!-- Keyboard -->
  <rect x="130" y="290" width="140" height="40" rx="4" fill="#2D3748"/>
  <g opacity="0.5">
    <rect x="140" y="298" width="8" height="8" rx="2" fill="#4A5568"/>
    <rect x="152" y="298" width="8" height="8" rx="2" fill="#4A5568"/>
    <rect x="164" y="298" width="8" height="8" rx="2" fill="#4A5568"/>
    <rect x="176" y="298" width="8" height="8" rx="2" fill="#4A5568"/>
    <rect x="140" y="310" width="8" height="8" rx="2" fill="#4A5568"/>
    <rect x="152" y="310" width="24" height="8" rx="2" fill="#4A5568"/>
  </g>
  
  <!-- Mouse -->
  <ellipse cx="290" cy="305" rx="15" ry="20" fill="#2D3748"/>
  <line x1="290" y1="295" x2="290" y2="310" stroke="#4A5568" stroke-width="2"/>
  
  <!-- Person -->
  <circle cx="200" cy="100" r="30" fill="#F7FAFC"/>
  <rect x="175" y="130" width="50" height="60" rx="10" fill="#1A202C"/>
  
  <!-- Glasses -->
  <circle cx="190" cy="100" r="8" fill="none" stroke="#4A5568" stroke-width="2"/>
  <circle cx="210" cy="100" r="8" fill="none" stroke="#4A5568" stroke-width="2"/>
  <line x1="198" y1="100" x2="202" y2="100" stroke="#4A5568" stroke-width="2"/>
  
  <!-- Arms Typing -->
  <rect x="155" y="140" width="20" height="10" rx="5" fill="#F7FAFC" transform="rotate(-30 165 145)"/>
  <rect x="225" y="140" width="20" height="10" rx="5" fill="#F7FAFC" transform="rotate(30 235 145)"/>
  
  <!-- Coffee Steam -->
  <path d="M 75 240 Q 70 230 75 220" stroke="#CBD5E0" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M 85 240 Q 80 230 85 220" stroke="#CBD5E0" stroke-width="2" fill="none" opacity="0.5"/>
  
  <!-- Coffee Cup -->
  <rect x="60" y="240" width="40" height="35" rx="4" fill="#F7FAFC" stroke="#4A5568" stroke-width="2"/>
  <ellipse cx="80" cy="240" rx="20" ry="6" fill="#F7FAFC" stroke="#4A5568" stroke-width="2"/>
  
  <!-- Plant -->
  <path d="M 310 260 L 315 290 L 335 290 L 340 260 Z" fill="#E2E8F0" stroke="#4A5568" stroke-width="2"/>
  <ellipse cx="325" cy="260" rx="15" ry="5" fill="#F7FAFC" stroke="#4A5568" stroke-width="2"/>
  <ellipse cx="315" cy="245" rx="8" ry="15" fill="#48BB78"/>
  <ellipse cx="325" cy="240" rx="8" ry="16" fill="#48BB78"/>
  <ellipse cx="335" cy="245" rx="8" ry="15" fill="#48BB78"/>
  
  <!-- Floating Code Symbols -->
  <text x="30" y="120" font-family="monospace" font-size="36" fill="#4361EE" opacity="0.3">&lt;/&gt;</text>
  <text x="320" y="180" font-family="monospace" font-size="32" fill="#7F52FF" opacity="0.3">{}</text>
</svg>
