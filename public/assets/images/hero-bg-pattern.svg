<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dot Pattern -->
  <defs>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#4361EE" opacity="0.15"/>
    </pattern>
    
    <pattern id="grid" x="0" y="0" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#4361EE" stroke-width="0.5" opacity="0.1"/>
    </pattern>
  </defs>
  
  <rect width="1200" height="800" fill="url(#dots)"/>
  
  <!-- Geometric Shapes -->
  <circle cx="150" cy="150" r="80" fill="none" stroke="#4361EE" stroke-width="2" opacity="0.2"/>
  <rect x="900" y="50" width="120" height="120" fill="none" stroke="#7F52FF" stroke-width="2" opacity="0.2" transform="rotate(15 960 110)"/>
  
  <circle cx="1050" cy="650" r="60" fill="none" stroke="#48BB78" stroke-width="2" opacity="0.2"/>
  <polygon points="100,700 150,650 200,700 150,750" fill="none" stroke="#F6AD55" stroke-width="2" opacity="0.2"/>
  
  <!-- Code Brackets -->
  <text x="50" y="500" font-family="monospace" font-size="120" fill="#4361EE" opacity="0.08">{</text>
  <text x="1050" y="400" font-family="monospace" font-size="120" fill="#7F52FF" opacity="0.08">}</text>
  
  <!-- Decorative Lines -->
  <path d="M 0 200 Q 300 180 600 200 T 1200 200" stroke="#4361EE" stroke-width="1" opacity="0.1" fill="none"/>
  <path d="M 0 600 Q 300 620 600 600 T 1200 600" stroke="#48BB78" stroke-width="1" opacity="0.1" fill="none"/>
</svg>
