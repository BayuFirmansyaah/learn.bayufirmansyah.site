<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Circle -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="#4361EE" stroke-width="3" opacity="0.3"/>
  <circle cx="100" cy="100" r="60" fill="none" stroke="#4361EE" stroke-width="2" opacity="0.2"/>
  
  <!-- Triangle -->
  <polygon points="300,50 350,150 250,150" fill="none" stroke="#48BB78" stroke-width="3" opacity="0.3"/>
  
  <!-- Square Rotated -->
  <rect x="50" y="250" width="100" height="100" fill="none" stroke="#7F52FF" stroke-width="3" opacity="0.3" transform="rotate(15 100 300)"/>
  
  <!-- Hexagon -->
  <polygon points="300,250 350,275 350,325 300,350 250,325 250,275" fill="none" stroke="#F6AD55" stroke-width="3" opacity="0.3"/>
  
  <!-- Plus Sign -->
  <line x1="200" y1="80" x2="200" y2="120" stroke="#4361EE" stroke-width="3" opacity="0.3"/>
  <line x1="180" y1="100" x2="220" y2="100" stroke="#4361EE" stroke-width="3" opacity="0.3"/>
  
  <!-- Cross -->
  <line x1="150" y1="200" x2="180" y2="230" stroke="#48BB78" stroke-width="3" opacity="0.3"/>
  <line x1="180" y1="200" x2="150" y2="230" stroke="#48BB78" stroke-width="3" opacity="0.3"/>
</svg>
