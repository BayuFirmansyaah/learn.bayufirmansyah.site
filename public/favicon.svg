<!-- SVG Favicon untuk Ubay Tech -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4361EE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5a75f9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="url(#grad1)"/>
  
  <!-- Code brackets -->
  <path d="M 30 30 L 20 50 L 30 70" stroke="#FFD700" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 70 30 L 80 50 L 70 70" stroke="#FFD700" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Center dot/slash -->
  <circle cx="50" cy="50" r="4" fill="#FFD700"/>
</svg>
